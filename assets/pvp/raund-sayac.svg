<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- TuşLab raund sayacı madalyonu (elle çizildi). Merkez (100,84), iç çekirdek r=44:
       pvp/rounds-ui.css halkayı ve saniyeyi tam bu dairenin üstüne yerleştirir. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset=".45" stop-color="#f6c460"/>
      <stop offset="1" stop-color="#a8611a"/>
    </linearGradient>
    <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a6"/>
      <stop offset="1" stop-color="#c47c25"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d78"/>
      <stop offset="1" stop-color="#140a33"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#34196e"/>
      <stop offset=".7" stop-color="#150a36"/>
      <stop offset="1" stop-color="#07031a"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#b56cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b56cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- mor neon hale -->
  <circle cx="100" cy="84" r="62" fill="url(#halo)"/>

  <!-- kanatlar: üç katlı bıçak tüyler; sağ kanat solun aynası -->
  <g id="kanat" stroke="url(#gs)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M62 62 L14 50 L4 60 L30 70 Z" fill="url(#w)"/>
    <path d="M58 80 L10 80 L2 92 L34 92 Z" fill="url(#w)"/>
    <path d="M62 100 L22 112 L18 124 L50 112 Z" fill="url(#w)"/>
    <path d="M14 50 L30 70 M10 80 L34 92 M22 112 L50 112" stroke="#c77dff" stroke-width="1" opacity=".75"/>
    <!-- kum saati -->
    <path d="M26 74 h10 l-5 6 l5 6 h-10 l5 -6 z" fill="#f6c460" stroke="#2a1404" stroke-width=".8"/>
  </g>
  <use href="#kanat" transform="matrix(-1 0 0 1 200 0)"/>

  <!-- alt uç (kalkan sivrisi) -->
  <path d="M82 126 L100 140 L118 126 Z" fill="url(#g)" stroke="#5a3108" stroke-width="1"/>
  <path d="M92 128 L100 134 L108 128 Z" fill="#c77dff"/>

  <!-- dış altın kasnak -->
  <circle cx="100" cy="84" r="51" fill="url(#g)"/>
  <circle cx="100" cy="84" r="51" fill="none" stroke="#5a3108" stroke-width="1.2"/>
  <!-- kasnak çentikleri (12 adet, saat kadranı) -->
  <circle cx="100" cy="84" r="48.5" fill="none" stroke="#6b3a0c" stroke-width="3"
          stroke-dasharray="1.6 23.79" transform="rotate(-90.9 100 84)"/>
  <!-- iç çekirdek -->
  <circle cx="100" cy="84" r="45" fill="url(#core)" stroke="#2a1404" stroke-width="1.5"/>
  <!-- neon iç çizgi -->
  <circle cx="100" cy="84" r="43" fill="none" stroke="#c77dff" stroke-width="2" opacity=".7" filter="url(#glow)"/>
  <circle cx="100" cy="84" r="43" fill="none" stroke="#e7c8ff" stroke-width=".7" opacity=".8"/>
  <!-- kasnağın tepe taşı -->
  <path d="M100 28 L108 36 L100 44 L92 36 Z" fill="#c77dff" stroke="url(#g)" stroke-width="2"/>
</svg>
