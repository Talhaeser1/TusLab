<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <!-- TuşLab ana ekran · Şiir & Atasözü kartı: tüy kalem, mürekkep, şiir satırları (elle yazılmış vektör, dış kaynak yok) -->
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="60%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8b5cff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6dcff"/>
      <stop offset=".55" stop-color="#b9a3ff"/>
      <stop offset="1" stop-color="#6d43e8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1640" stop-opacity=".9"/>
      <stop offset="1" stop-color="#120e2c" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#halo)"/>
  <g transform="translate(26 4)">

  <!-- süslü çerçeve kemeri -->
  <path d="M86 236 V96 Q86 40 150 28 Q200 18 250 28 Q314 40 314 96 V236" fill="none" stroke="#b9a3ff" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M98 236 V100 Q98 52 154 41 Q200 32 246 41 Q302 52 302 100 V236" fill="url(#page)" stroke="#b9a3ff" stroke-opacity=".4" stroke-width="1.2"/>
  <g fill="#b9a3ff" fill-opacity=".55">
    <path d="M200 46 l5 7 -5 7 -5 -7z"/>
    <circle cx="180" cy="53" r="1.8"/><circle cx="220" cy="53" r="1.8"/>
  </g>

  <!-- şiir satırları -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#e9e2ff">
    <text x="120" y="88" font-size="17">Ağaç yaşken eğilir,</text>
    <text x="120" y="114" font-size="17" fill-opacity=".8">damlaya damlaya</text>
    <text x="134" y="140" font-size="17" fill-opacity=".62">göl olur…</text>
  </g>
  <!-- mürekkep dalga satırları (henüz yazılmamış dizeler) -->
  <g fill="none" stroke="#b9a3ff" stroke-linecap="round" stroke-width="2">
    <path d="M120 166 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0" stroke-opacity=".45"/>
    <path d="M120 188 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0" stroke-opacity=".3"/>
    <path d="M120 210 q10 -5 20 0 t20 0 t20 0" stroke-opacity=".2"/>
  </g>

  <!-- tüy kalem -->
  <g transform="translate(248 160) rotate(38)">
    <path d="M0 0 C 18 -40, 22 -96, 6 -150 C -6 -110, -24 -62, -14 -8 Z" fill="url(#feather)" fill-opacity=".92" filter="url(#g)"/>
    <path d="M-4 -2 C 0 -50, 2 -100, 6 -148" fill="none" stroke="#2b1a66" stroke-width="1.4" stroke-opacity=".7"/>
    <g stroke="#2b1a66" stroke-opacity=".45" stroke-width="1" fill="none">
      <path d="M-2 -30 l12 -10"/><path d="M-1 -56 l14 -12"/><path d="M1 -82 l13 -12"/><path d="M3 -108 l10 -10"/>
      <path d="M-3 -40 l-10 -6"/><path d="M-2 -66 l-11 -7"/><path d="M0 -92 l-9 -7"/>
    </g>
    <path d="M-6 -4 L-3 22 L-1 -3 Z" fill="#e6dcff"/>
  </g>
  <!-- mürekkep damlası ve parıltı -->
  <circle cx="232" cy="190" r="4" fill="#b9a3ff" filter="url(#g)"/>
  <circle cx="242" cy="198" r="2" fill="#b9a3ff" fill-opacity=".6"/>
  <g fill="#e6dcff">
    <path d="M326 70 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill-opacity=".8"/>
    <path d="M70 140 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" fill-opacity=".5"/>
  </g>
  </g>
</svg>
