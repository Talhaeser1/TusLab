<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <!-- TuşLab ana ekran · Yazma Arenası kartı: neon klavye + akan Türkçe harfler (elle yazılmış vektör, dış kaynak yok) -->
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="55%" cy="55%" r="55%">
      <stop offset="0" stop-color="#3fe0ff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#3fe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3fe0ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#3fe0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#halo)"/>

  <!-- yazılan satır (imleçli) -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-weight="700">
    <rect x="134" y="28" width="234" height="38" rx="12" fill="#06101f" fill-opacity=".8" stroke="#3fe0ff" stroke-opacity=".5"/>
    <text x="148" y="53" font-size="16" fill="#eaffff">Damlaya damlaya<tspan fill="#3fe0ff" fill-opacity=".42"> göl olur</tspan></text>
    <rect x="283" y="38" width="2.5" height="19" rx="1" fill="#3fe0ff" filter="url(#g)"/>
  </g>

  <!-- tuşlardan yukarı uçan harfler -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-weight="800" fill="#3fe0ff">
    <rect x="153" y="98" width="2" height="44" fill="url(#trail)"/>
    <text x="145" y="102" font-size="22" filter="url(#g)">ğ</text>
    <rect x="210" y="92" width="2" height="34" fill="url(#trail)" opacity=".7"/>
    <text x="203" y="94" font-size="16" fill-opacity=".7">ş</text>
    <rect x="272" y="100" width="2" height="48" fill="url(#trail)"/>
    <text x="263" y="102" font-size="24" filter="url(#g)">ü</text>
    <text x="314" y="98" font-size="14" fill-opacity=".5">ç</text>
    <text x="180" y="124" font-size="13" fill-opacity=".45">ı</text>
    <text x="238" y="132" font-size="15" fill-opacity=".55">ö</text>
  </g>

  <!-- eğik neon klavye -->
  <g transform="translate(214 196) rotate(-7) skewX(-14)" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <g fill="#3fe0ff" fill-opacity=".07" stroke="#3fe0ff" stroke-opacity=".5" stroke-width="1.2">
      <rect x="-198" y="-62" width="32" height="30" rx="7"/><rect x="-162" y="-62" width="32" height="30" rx="7"/>
      <rect x="-126" y="-62" width="32" height="30" rx="7"/><rect x="-90" y="-62" width="32" height="30" rx="7"/>
      <rect x="-54" y="-62" width="32" height="30" rx="7"/><rect x="-18" y="-62" width="32" height="30" rx="7"/>
      <rect x="18" y="-62" width="32" height="30" rx="7"/><rect x="54" y="-62" width="32" height="30" rx="7"/>
      <rect x="90" y="-62" width="32" height="30" rx="7"/><rect x="126" y="-62" width="32" height="30" rx="7"/>
      <rect x="162" y="-62" width="32" height="30" rx="7"/>
      <rect x="-188" y="-26" width="32" height="30" rx="7"/><rect x="-152" y="-26" width="32" height="30" rx="7"/>
      <rect x="-116" y="-26" width="32" height="30" rx="7"/><rect x="-80" y="-26" width="32" height="30" rx="7"/>
      <rect x="-44" y="-26" width="32" height="30" rx="7"/><rect x="-8" y="-26" width="32" height="30" rx="7"/>
      <rect x="28" y="-26" width="32" height="30" rx="7"/><rect x="64" y="-26" width="32" height="30" rx="7"/>
      <rect x="100" y="-26" width="32" height="30" rx="7"/><rect x="136" y="-26" width="32" height="30" rx="7"/>
      <rect x="-170" y="10" width="32" height="30" rx="7"/><rect x="-134" y="10" width="32" height="30" rx="7"/>
      <rect x="-98" y="10" width="32" height="30" rx="7"/><rect x="-62" y="10" width="32" height="30" rx="7"/>
      <rect x="-26" y="10" width="32" height="30" rx="7"/><rect x="10" y="10" width="32" height="30" rx="7"/>
      <rect x="46" y="10" width="32" height="30" rx="7"/><rect x="82" y="10" width="32" height="30" rx="7"/>
      <rect x="118" y="10" width="32" height="30" rx="7"/>
      <rect x="-98" y="46" width="176" height="26" rx="7"/>
    </g>
    <!-- basılı tuşlar -->
    <g fill="#3fe0ff" fill-opacity=".38" stroke="#bff6ff" stroke-width="1.4" filter="url(#g)">
      <rect x="-54" y="-62" width="32" height="30" rx="7"/>
      <rect x="64" y="-26" width="32" height="30" rx="7"/>
      <rect x="-134" y="10" width="32" height="30" rx="7"/>
    </g>
    <g fill="#bdefff" fill-opacity=".72">
      <text x="-182" y="-42">W</text><text x="-146" y="-42">E</text><text x="-110" y="-42">R</text><text x="-74" y="-42">T</text>
      <text x="-38" y="-42" fill="#ffffff" fill-opacity="1">Y</text><text x="-2" y="-42">U</text><text x="34" y="-42">I</text>
      <text x="70" y="-42">O</text><text x="106" y="-42">P</text><text x="142" y="-42">Ğ</text><text x="178" y="-42">Ü</text>
      <text x="-172" y="-6">A</text><text x="-136" y="-6">S</text><text x="-100" y="-6">D</text><text x="-64" y="-6">F</text>
      <text x="-28" y="-6">G</text><text x="8" y="-6">H</text><text x="44" y="-6">J</text>
      <text x="80" y="-6" fill="#ffffff" fill-opacity="1">Ş</text><text x="116" y="-6">İ</text><text x="152" y="-6">K</text>
      <text x="-154" y="30">&lt;</text>
      <text x="-118" y="30" fill="#ffffff" fill-opacity="1">Z</text><text x="-82" y="30">X</text><text x="-46" y="30">C</text>
      <text x="-10" y="30">V</text><text x="26" y="30">B</text><text x="62" y="30">N</text>
      <text x="98" y="30">Ö</text><text x="134" y="30">Ç</text>
    </g>
  </g>
</svg>
