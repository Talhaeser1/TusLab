  <!-- TuşLab ana ekran · Klavye Dersleri kartı: temel sıra parmak haritası + yıldızlı ilerleme yolu (elle yazılmış vektör, dış kaynak yok) -->
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="55%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffc861" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffc861" stop-opacity="0"/>
    </radialGradient>
    <path id="star" d="M0-7 2.1-2.2 7.3-2.2 3.1 1 4.6 6.2 0 3.2-4.6 6.2-3.1 1-7.3-2.2-2.1-2.2Z"/>
  </defs>
  <rect width="400" height="280" fill="url(#halo)"/>

  <!-- ilerleme yolu (temel sıranın üstünde, sağa doğru açılır) -->
  <path d="M150 52 C 176 52, 186 30, 214 30 S 252 56, 280 50 S 324 22, 352 22 S 384 10, 396 4"
