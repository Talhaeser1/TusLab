        fill="none" stroke="#ffc861" stroke-opacity=".55" stroke-width="2.4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g stroke="#ffc861" stroke-width="2">
    <circle cx="150" cy="52" r="8" fill="#ffc861"/>
    <circle cx="214" cy="30" r="8" fill="#ffc861"/>
    <circle cx="280" cy="50" r="10" fill="#2a1d08" stroke-width="3" filter="url(#g)"/>
    <circle cx="352" cy="22" r="7" fill="#120f1e" stroke-opacity=".55"/>
  </g>
  <circle cx="280" cy="50" r="4" fill="#ffc861"/>
  <circle cx="280" cy="50" r="17" fill="none" stroke="#ffc861" stroke-opacity=".3" stroke-width="1.5"/>
  <g fill="#fff3d1" transform="translate(0 0)">
    <use href="#star" x="140" y="70" transform="scale(1)"/><use href="#star" x="150" y="74"/><use href="#star" x="160" y="70"/>
    <use href="#star" x="204" y="12"/><use href="#star" x="214" y="9"/><use href="#star" x="224" y="12" fill="#ffc861" fill-opacity=".35"/>
  </g>

